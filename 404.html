<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — GeoMont</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<style>
/* La letra: desde la raiz del dominio y, si esa falla (la pagina abierta
   desde el disco), desde la carpeta de al lado. */
@font-face {
  font-family: "IBM Plex Sans";
  src: url("/fonts/IBMPlexSans-Regular.ttf") format("truetype"),
       url("fonts/IBMPlexSans-Regular.ttf") format("truetype");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: "IBM Plex Sans";
  src: url("/fonts/IBMPlexSans-Bold.ttf") format("truetype"),
       url("fonts/IBMPlexSans-Bold.ttf") format("truetype");
  font-weight: 700;
  font-display: swap;
}
:root {
  color-scheme: light dark;
  --fondo: #F4F5F1;
  --tarjeta: #FFFFFF;
  --borde: #D7DBD2;
  --texto: #111315;
  --tenue: #4F565C;
  --acento: #E65C00;
  --acento-texto: #B84A00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #101316;
    --tarjeta: #181C21;
    --borde: #2B3139;
    --texto: #E9EDF1;
    --tenue: #98A2AD;
    --acento: #F16008;
    --acento-texto: #FF8A3D;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 32px 16px;
  background: var(--fondo);
  color: var(--texto);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.55;
}
main {
  max-width: 480px;
  margin: 0 auto;
  padding: 24px;
  border: 2px solid var(--borde);
  border-radius: 18px;
  background: var(--tarjeta);
}
.marca { margin: 0; font-size: 1.375rem; font-weight: 700; }
.codigo { margin: 16px 0 0; font-size: 3.25rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.5px; color: var(--acento-texto); }
h1 { margin: 4px 0 16px; font-size: 1.25rem; line-height: 1.3; }
p { margin: 0 0 8px; }
a { color: var(--acento-texto); text-underline-offset: 0.18em; }
a:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="marca">GeoMont</p>
  <p class="codigo">404</p>
  <h1>Page not found</h1>
  <p>This page does not exist. <a href="/">Go to the GeoMont home page</a>.</p>
  <p lang="es">Esta página no existe. <a href="/es/" hreflang="es">Ir a la portada de GeoMont</a>.</p>
</main>
</body>
</html>
